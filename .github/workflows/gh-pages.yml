name: Deploy to GitHub Pages

on:
  push:
    branches: main
  workflow_dispatch:

# Builds the static site and publishes build/ to the gh-pages branch, which GitHub Pages serves.
# Pushes from the AndrewNashCV resume-sync workflow land on main and redeploy through here.
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build
          publish_branch: gh-pages
          force_orphan: true
